version: '3.9'

services:
  app:
    build: .
    image: ts-service-template:local
    container_name: ts-service-template
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      # The app doesn't use DB/Redis yet, but wiring envs now sets a stable contract:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: ts-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ts-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

volumes:
  pg_data:
